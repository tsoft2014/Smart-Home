name: Build Kivy APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Добавляем настройку Java 17 здесь:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            python3-dev \
            ccache \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            clang

      - name: Install Python build tools
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "Cython<3.0.0" buildozer
          # Обновляем python-for-android до актуальной версии
          python3 -m pip install --upgrade python-for-android

      - name: Build APK with Buildozer
        run: |
          rm -rf .buildozer
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-kivy-apk
          path: bin/*.apk
