name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Install System Dependencies
        run: |
          # Полностью удаляем проблемный пакет command-not-found, чтобы он не вызывал exit code 100
          sudo apt-get remove -y command-not-found || true
          
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autotools-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            libssl-dev \
            libffi-dev \
            libltdl-dev \
            libncurses5 \
            libstdc++6 \
            zlib1g
            
          python3 -m pip install --upgrade pip setuptools
          pip install "buildozer==1.5.0" "cython==0.29.36"
          
      - name: Clean Broken Buildozer Cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      #- name: Upload APK Artifact
       # uses: actions/upload-artifact@v4
        #with:
         # name: SmartHome-Debug-APK
          #path: bin/*.apk

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "SmartHome APK v1.0.${{ github.run_number }}"
          body: "Автоматическая сборка приложения с поддержкой OpenCV и Vosk."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
