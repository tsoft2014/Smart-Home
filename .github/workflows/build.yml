name: Build Android APK via Official Docker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildozer cache directory
        run: mkdir -p .buildozer

      # Кэшируем системную папку .buildozer, где хранятся SDK, NDK и загруженные рецепты
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK using official Kivy Buildozer container
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/home/user/hostcwd" \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Fix APK and cache permissions
        if: always()
        run: |
          sudo chown -R $USER:$USER bin/ .buildozer/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-Debug-APK
          path: bin/*.apk
