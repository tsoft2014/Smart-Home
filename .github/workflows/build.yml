name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Install System Dependencies
        run: |
          # Полностью удаляем проблемный пакет command-not-found, чтобы он не вызывал exit code 100
          sudo apt-get remove -y command-not-found || true
          
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autotools-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            libssl-dev \
            libffi-dev \
            libltdl-dev \
            libncurses5 \
            libstdc++6 \
            zlib1g
            
          python3 -m pip install --upgrade pip setuptools
          pip install "buildozer==1.5.0" "cython==0.29.36"
          
      - name: Clean Broken Buildozer Cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      #- name: Upload APK Artifact
       # uses: actions/upload-artifact@v4
        #with:
         # name: SmartHome-Debug-APK
          #path: bin/*.apk

      - name: Upload APK to tmpfiles.org
        run: |
          echo "Ищем собранный APK..."
          APK_PATH=$(find bin -name "*.apk" | head -n 1)
          
          if [ -f "$APK_PATH" ]; then
            echo "Загружаем APK на tmpfiles.org..."
            
            # Загружаем файл и получаем чистый JSON-ответ
            RESPONSE=$(curl -s -F "file=@$APK_PATH" https://tmpfiles.org/api/v1/upload)
            
            # Превращаем обычную ссылку в прямую ссылку на скачивание
            DOWNLOAD_URL=$(echo $RESPONSE | jq -r '.data.url' | sed 's/tmpfiles.org\//tmpfiles.org\/dl\//')
            
            echo ""
            echo "===================================================="
            echo " ССЫЛКА НА СКАЧИВАНИЕ APK:"
            echo " $DOWNLOAD_URL"
            echo "===================================================="
          else
            echo "Ошибка: APK-файл не найден в папке bin!"
            exit 1
          fi
