name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Install System Dependencies
        run: |
          # Полностью удаляем проблемный пакет command-not-found, чтобы он не вызывал exit code 100
          sudo apt-get remove -y command-not-found || true
          
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autotools-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            libssl-dev \
            libffi-dev \
            libltdl-dev \
            libncurses5 \
            libstdc++6 \
            zlib1g
            
          python3 -m pip install --upgrade pip setuptools
          pip install "buildozer==1.5.0" "cython==0.29.36"
          
      - name: Clean Broken Buildozer Cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      #- name: Upload APK Artifact
       # uses: actions/upload-artifact@v4
        #with:
         # name: SmartHome-Debug-APK
          #path: bin/*.apk

      - name: Upload APK to File.io (One-time download)
        run: |
          echo "Ищем собранный APK..."
          APK_PATH=$(find bin -name "*.apk" | head -n 1)
          
          if [ -f "$APK_PATH" ]; then
            echo "Загружаем APK на file.io с обходом защиты..."
            # Добавили -L (следовать редиректам) и -A (User-Agent маскировка под браузер)
            RESPONSE=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -F "file=@$APK_PATH" https://file.io)
            
            echo ""
            echo "===================================================="
            echo " Ответ сервера: $RESPONSE"
            echo " (Ищите поле \"link\" с адресом для скачивания)"
            echo "===================================================="
          else
            echo "Ошибка: APK-файл не найден в папке bin!"
            exit 1
          fi
