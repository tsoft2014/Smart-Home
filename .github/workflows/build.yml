name: Build Android APK via Official Docker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean previous build artifacts
        run: |
          rm -rf .buildozer bin

      - name: Build APK using official Kivy Buildozer container
        run: |
          docker run --rm \
            -u 1000:1000 \
            --volume "${{ github.workspace }}:/home/user/hostcwd" \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-Debug-APK
          path: bin/*.apk
