name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Install System Dependencies
        run: |
          sudo apt-get remove -y command-not-found || true
          
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autotools-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            libssl-dev \
            libffi-dev \
            libltdl-dev \
            libncurses5 \
            libstdc++6 \
            zlib1g
          
          python3 -m pip install --upgrade pip setuptools
          pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Prepare Local camera4kivy Source
        run: |
          mkdir -p local_recipes/camera4kivy
          
          # Клонируем исходный код через стабильный git-протокол
          git clone --depth 1 https://github.com/mitch-cult/camera4kivy.git camera4kivy_src
          
          # Копируем содержимое в папку локального рецепта p4a
          cp -r camera4kivy_src/* local_recipes/camera4kivy/
          
          # Создаем рецепт p4a с url = None для сборки из локальных файлов
          cat << 'EOF' > local_recipes/camera4kivy/__init__.py
          from pythonforandroid.recipe import PythonRecipe

          class Camera4kivyRecipe(PythonRecipe):
              version = 'master'
              url = None
              depends = ['kivy', 'pyjnius']
              call_hostpython_via_targetpython = False
              
          recipe = Camera4kivyRecipe()
          EOF

      - name: Clean Broken Buildozer Cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "SmartHome APK v1.0.${{ github.run_number }}"
          body: "Автоматическая сборка приложения с поддержкой camera4kivy, OpenCV и Vosk."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
