name: Build Kivy APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK with Docker
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            -v ${{ github.workspace }}:/home/user/hostpython \
            kivy/buildozer -c "yes | buildozer -v android debug"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-kivy-apk
          path: bin/*.apk
