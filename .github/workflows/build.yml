name: Build Android APK via Official Docker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Кэшируем папку .buildozer, чтобы SDK, NDK и gradle не скачивались заново при каждом коммите
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_cache
          key: buildozer-sdk-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-sdk-

      - name: Prepare buildozer cache directory
        run: mkdir -p .buildozer_cache

      - name: Build APK using official Kivy Buildozer container
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/home/user/hostcwd" \
            --volume "${{ github.workspace }}/.buildozer_cache:/home/user/.buildozer" \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Fix APK and cache permissions
        run: |
          sudo chown -R $USER:$USER bin/ .buildozer_cache/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-Debug-APK
          path: bin/*.apk
