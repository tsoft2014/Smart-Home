name: Build Kivy APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev python3-dev \
          gettext libssl-dev ccache ffmpeg libsdl2-dev libsdl2-image-dev \
          libsdl2-mixin-dev libsdl2-ttf-dev libportmidi-dev \
          python3-setuptools openjdk-17-jdk zip unzip tar
        pip install --upgrade pip setuptools buildozer Cython

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-kivy-apk
        path: bin/*.apk
