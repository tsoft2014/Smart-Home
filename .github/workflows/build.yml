name: Build Android APK (Custom Environment)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean previous build artifacts
        run: |
          rm -rf .buildozer bin

      - name: Build custom Docker image
        run: |
          docker build -t my-buildozer-env .

      - name: Run buildozer inside custom container
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/home/user/hostcwd" \
            -e BUILDOZER_ALLOW_ROOT=1 \
            my-buildozer-env \
            buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-Debug-APK
          path: bin/*.apk
